<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HERBI Sense — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#183F30;
    --forest-2:#22553F;
    --leaf:#7CB93B;
    --leaf-light:#E7F2DA;
    --amber:#E8A23A;
    --amber-light:#FCF1DE;
    --red:#D4574A;
    --red-light:#FBE7E4;
    --paper:#F4F7F1;
    --card:#FFFFFF;
    --ink:#1B2A20;
    --ink-soft:#5B6B60;
    --line:#E3E9DD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .stage{
    width:100%;
    max-width:1120px;
    display:flex;
    justify-content:center;
  }

  /* ---- Desktop sidebar layout ---- */
  .desktop-shell{
    display:none;
  }
  @media (min-width:681px){
    body{
      padding:0;
      background:var(--paper);
      min-height:100vh;
    }
    .stage{ display:none; }
    .desktop-shell{
      display:flex;
      width:100%;
      min-height:100vh;
    }
    /* Sidebar */
    .sidebar{
      width:240px;
      flex-shrink:0;
      background:linear-gradient(180deg, #183F30 0%, #122e23 100%);
      display:flex;
      flex-direction:column;
      padding:0;
      position:fixed;
      top:0;
      left:0;
      height:100vh;
      z-index:100;
      box-shadow:4px 0 32px rgba(24,63,48,.28);
    }
    .sidebar-logo{
      padding:26px 22px 20px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .sidebar-logo .app-icon{
      width:38px;height:38px;background:var(--leaf);border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      font-size:20px;margin-bottom:10px;
      box-shadow:0 4px 12px rgba(124,185,59,.35);
    }
    .sidebar-logo .app-name{
      font-family:'Space Grotesk',sans-serif;
      font-size:17px;
      font-weight:700;
      color:#fff;
      letter-spacing:.01em;
    }
    .sidebar-logo .app-sub{
      font-size:10.5px;
      color:rgba(255,255,255,.45);
      margin-top:2px;
      line-height:1.4;
    }
    .sidebar-nav{
      flex:1;
      padding:14px 10px;
      display:flex;
      flex-direction:column;
      gap:2px;
      overflow-y:auto;
    }
    .sidebar-section-label{
      font-size:9.5px;
      font-weight:700;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:rgba(255,255,255,.3);
      padding:10px 12px 4px;
    }
    .sidebar-item{
      display:flex;
      align-items:center;
      gap:11px;
      padding:10px 13px;
      border-radius:10px;
      color:rgba(255,255,255,.6);
      font-size:13px;
      font-weight:600;
      cursor:pointer;
      transition:background .18s, color .18s, transform .12s;
      -webkit-tap-highlight-color:transparent;
      position:relative;
    }
    .sidebar-item svg{
      width:17px;height:17px;
      stroke:rgba(255,255,255,.55);
      fill:none;
      stroke-width:1.8;
      flex-shrink:0;
      transition:stroke .18s;
    }
    .sidebar-item:hover{
      background:rgba(255,255,255,.07);
      color:rgba(255,255,255,.9);
      transform:translateX(2px);
    }
    .sidebar-item:hover svg{ stroke:rgba(255,255,255,.9); }
    .sidebar-item.active{
      background:linear-gradient(90deg,var(--leaf) 0%,#5da320 100%);
      color:#fff;
      box-shadow:0 4px 14px rgba(124,185,59,.35);
    }
    .sidebar-item.active svg{ stroke:#fff; }
    .sidebar-footer{
      padding:14px 18px;
      border-top:1px solid rgba(255,255,255,.08);
    }
    .sidebar-footer .avatar-row{
      display:flex;align-items:center;gap:10px;
    }
    .sidebar-footer .mini-avatar{
      width:34px;height:34px;border-radius:50%;
      background:linear-gradient(135deg,var(--leaf),var(--forest-2));
      display:flex;align-items:center;justify-content:center;
      font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:#fff;
      flex-shrink:0;
    }
    .sidebar-footer .role-badge{
      font-size:10px;
      color:rgba(255,255,255,.45);
      line-height:1;
    }
    .sidebar-footer .role-name{
      font-size:12px;
      font-weight:600;
      color:#fff;
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:130px;
    }
    /* Main content area */
    .desktop-main{
      margin-left:240px;
      flex:1;
      display:flex;
      flex-direction:column;
      height:100vh;
      overflow:hidden;
    }
    .desktop-topbar{
      height:64px;
      flex-shrink:0;
      background:#fff;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      padding:0 36px;
      z-index:50;
      gap:12px;
      box-shadow:0 1px 4px rgba(0,0,0,.04);
    }
    .desktop-topbar h1{
      font-family:'Space Grotesk',sans-serif;
      font-size:19px;
      font-weight:700;
      color:var(--forest);
      margin:0;
      flex:1;
    }
    .desktop-topbar .deskback{
      width:34px;height:34px;border-radius:10px;
      background:var(--paper);
      border:1px solid var(--line);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;
      transition:background .15s, box-shadow .15s;
    }
    .desktop-topbar .deskback:hover{ background:var(--leaf-light); box-shadow:0 2px 8px rgba(124,185,59,.2); }
    .desktop-topbar .deskback svg{ width:15px;height:15px; }
    .desktop-topbar .topbar-date{
      font-size:12px;color:var(--ink-soft);font-weight:500;
    }

    /* ---- DESKTOP CONTENT ---- */
    .desktop-content{
      flex:1;
      padding:28px 32px 60px;
      width:100%;
      max-width:none;
      overflow-y:auto;
      background:#EEF2EC;
    }
    .desktop-content::-webkit-scrollbar{ width:6px; }
    .desktop-content::-webkit-scrollbar-thumb{ background:#D0DBCB; border-radius:3px; }

    /* ===== DESKTOP CARD SYSTEM ===== */
    .d-card{
      background:#fff;
      border-radius:16px;
      border:1px solid #DDE6D8;
      box-shadow:0 2px 12px rgba(0,0,0,.06);
      overflow:hidden;
      transition:box-shadow .2s;
    }
    .d-card:hover{ box-shadow:0 6px 24px rgba(0,0,0,.10); }
    .d-card-header{
      padding:18px 22px 14px;
      border-bottom:1px solid #EEF2EC;
      display:flex;align-items:center;justify-content:space-between;
    }
    .d-card-title{
      font-family:'Space Grotesk',sans-serif;
      font-size:13px;font-weight:700;
      color:#5B6B60;text-transform:uppercase;letter-spacing:.06em;
    }
    .d-card-body{ padding:22px; }
    .d-card-body-0{ padding:0; }

    /* ===== METRIC CARDS ===== */
    .d-metric-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-bottom:24px;
    }
    .d-metric{
      border-radius:16px;
      padding:22px 20px;
      position:relative;
      overflow:hidden;
      border:1px solid transparent;
    }
    .d-metric.green{ background:linear-gradient(135deg,#1B4D36,#2E6B4F); }
    .d-metric.teal{ background:linear-gradient(135deg,#1E5A4A,#25775E); }
    .d-metric.amber{ background:linear-gradient(135deg,#8A5A16,#B07820); }
    .d-metric.red{ background:linear-gradient(135deg,#9C3327,#C04034); }
    .d-metric-icon{
      width:36px;height:36px;border-radius:10px;
      background:rgba(255,255,255,.15);
      display:flex;align-items:center;justify-content:center;
      margin-bottom:14px;
    }
    .d-metric-icon svg{ width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8; }
    .d-metric-val{
      font-family:'Space Grotesk',sans-serif;
      font-size:28px;font-weight:700;color:#fff;line-height:1;
    }
    .d-metric-label{ font-size:11.5px;color:rgba(255,255,255,.7);margin-top:6px;font-weight:500; }
    .d-metric-sub{ font-size:10.5px;color:rgba(255,255,255,.5);margin-top:4px; }

    /* ===== PAGE GRID ===== */
    .d-page-2col{ display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start; }
    .d-page-3col{ display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start; }
    .d-full{ grid-column:1/-1; }

    /* ===== TABLE ROWS ===== */
    .d-table-row{
      display:flex;align-items:center;justify-content:space-between;
      padding:13px 22px;
      border-bottom:1px solid #EEF2EC;
    }
    .d-table-row:last-child{ border-bottom:none; }
    .d-table-row:hover{ background:#F7FAF5; }
    .d-table-lbl{ font-size:13px;color:#5B6B60;font-weight:500; }
    .d-table-val{ font-size:13.5px;font-weight:700;color:#1B2A20; }

    /* ===== JOB GRID ===== */
    .d-job-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:14px;
    }
    .d-job-card{
      background:#fff;
      border:1.5px solid #DDE6D8;
      border-radius:14px;
      padding:18px 20px;
      cursor:pointer;
      transition:all .18s;
    }
    .d-job-card:hover{
      border-color:#7CB93B;
      box-shadow:0 8px 24px rgba(24,63,48,.12);
      transform:translateY(-3px);
    }
    .d-job-top{ display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
    .d-job-code{
      font-family:'Space Grotesk',sans-serif;
      font-size:18px;font-weight:700;color:#183F30;
    }
    .d-job-afd{
      font-size:10.5px;font-weight:700;color:#7CB93B;
      background:#E7F2DA;padding:3px 8px;border-radius:100px;
    }
    .d-job-gulma{ font-size:12px;color:#5B6B60;margin-bottom:8px;line-height:1.4; }
    .d-job-meta{ display:flex;gap:12px;align-items:center;flex-wrap:wrap; }
    .d-job-chip{ font-size:11px;font-weight:600;color:#5B6B60; }

    /* ===== BTN SYSTEM ===== */
    .d-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      border:none;border-radius:12px;cursor:pointer;
      font-family:'Inter',sans-serif;font-weight:700;
      transition:all .18s;
      text-decoration:none;
    }
    .d-btn-primary{
      background:linear-gradient(135deg,#183F30,#22553F);
      color:#fff;padding:13px 28px;font-size:14px;
      box-shadow:0 4px 16px rgba(24,63,48,.25);
    }
    .d-btn-primary:hover{ box-shadow:0 8px 28px rgba(24,63,48,.35);transform:translateY(-1px); }
    .d-btn-green{
      background:linear-gradient(135deg,#7CB93B,#5da320);
      color:#fff;padding:13px 28px;font-size:14px;
      box-shadow:0 4px 16px rgba(124,185,59,.3);
    }
    .d-btn-green:hover{ box-shadow:0 8px 28px rgba(124,185,59,.45);transform:translateY(-1px); }
    .d-btn-ghost{
      background:#fff;color:#183F30;
      border:1.5px solid #DDE6D8;
      padding:12px 24px;font-size:14px;
    }
    .d-btn-ghost:hover{ border-color:#7CB93B;background:#E7F2DA; }
    .d-btn-full{ width:100%;margin-top:16px; }

    /* ===== SECTION HEADING ===== */
    .d-section-heading{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:14px;
    }
    .d-section-title{
      font-family:'Space Grotesk',sans-serif;
      font-size:16px;font-weight:700;color:#1B2A20;
    }
    .d-section-sub{ font-size:12px;color:#5B6B60;margin-top:2px; }

    /* ===== GREETING BANNER ===== */
    .d-greet-banner{
      background:linear-gradient(120deg,#183F30 0%,#22553F 60%,#2B6B50 100%);
      border-radius:20px;
      padding:28px 32px;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:24px;
      overflow:hidden;
      position:relative;
    }
    .d-greet-banner::after{
      content:'';
      position:absolute;right:-20px;top:-20px;
      width:180px;height:180px;
      background:radial-gradient(circle,rgba(124,185,59,.18) 0%,transparent 70%);
      border-radius:50%;
    }
    .d-greet-sub{ font-size:13px;opacity:.7;margin-bottom:4px; }
    .d-greet-name{ font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700; }
    .d-greet-date{ font-size:12px;opacity:.6;margin-top:4px; }

    /* ===== ALERT CARDS ===== */
    .d-alert{
      display:flex;align-items:center;gap:14px;
      padding:14px 18px;border-radius:12px;margin-bottom:10px;
    }
    .d-alert.warn{ background:#FCF1DE;border:1px solid #E8A23A; }
    .d-alert.danger{ background:#FBE7E4;border:1px solid #D4574A; }
    .d-alert.info{ background:#E7F2DA;border:1px solid #7CB93B; }
    .d-alert-icon{ width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px; }
    .d-alert.warn .d-alert-icon{ background:#F5D796; }
    .d-alert.danger .d-alert-icon{ background:#F5C4BC; }
    .d-alert.info .d-alert-icon{ background:#C2DFA0; }
    .d-alert-content .d-alert-title{ font-weight:700;font-size:13.5px;color:#1B2A20; }
    .d-alert-content .d-alert-sub{ font-size:12px;color:#5B6B60;margin-top:2px; }

    /* ===== BADGE ===== */
    .d-badge{
      display:inline-flex;align-items:center;
      font-size:11px;font-weight:700;
      padding:4px 12px;border-radius:100px;letter-spacing:.02em;
    }
    .d-badge.done{ background:#E7F2DA;color:#3E6E1B; }
    .d-badge.pending{ background:#FCF1DE;color:#8A5A16; }
    .d-badge.over{ background:#FBE7E4;color:#9C3327; }

    /* ===== DONUT CHART ===== */
    .d-donut-wrap{
      display:flex;align-items:center;gap:32px;padding:8px 0;
    }
    .d-donut{
      width:140px;height:140px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
    }
    .d-donut-hole{
      width:100px;height:100px;border-radius:50%;background:#fff;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    .d-donut-n{ font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#183F30; }
    .d-donut-l{ font-size:10px;color:#5B6B60; }
    .d-donut-stats{ flex:1; }
    .d-donut-stat{ margin-bottom:14px; }
    .d-donut-stat-label{ font-size:12px;color:#5B6B60;margin-bottom:4px; }
    .d-donut-stat-val{ font-size:18px;font-weight:700;font-family:'Space Grotesk',sans-serif; }

    /* ===== MAP GRID ===== */
    .d-mapgrid{ display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px; }
    .d-mapcell{
      aspect-ratio:1.2;border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      font-size:10.5px;font-weight:700;color:#fff;
      font-family:'Space Grotesk',sans-serif;
      transition:transform .15s;
    }
    .d-mapcell:hover{ transform:scale(1.08); }

    /* ===== RANK LIST ===== */
    .d-rank-row{
      display:flex;align-items:center;gap:14px;
      padding:13px 22px;
      border-bottom:1px solid #EEF2EC;
    }
    .d-rank-row:last-child{ border-bottom:none; }
    .d-rank-num{
      width:26px;height:26px;border-radius:8px;
      background:#EEF2EC;display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:700;color:#5B6B60;flex-shrink:0;
    }
    .d-rank-num.top{ background:#183F30;color:#fff; }
    .d-rank-code{ font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:#183F30;flex:1; }
    .d-rank-val{ font-size:13px;font-weight:700;color:#D4574A; }
    .d-rank-bar-wrap{ width:80px;height:6px;background:#EEF2EC;border-radius:3px;overflow:hidden; }
    .d-rank-bar{ height:100%;border-radius:3px;background:linear-gradient(90deg,#D4574A,#b03027); }

    /* Progress bar */
    .d-progress-wrap{ background:#EEF2EC;border-radius:6px;height:8px;overflow:hidden;margin-top:6px; }
    .d-progress{ height:100%;border-radius:6px;background:linear-gradient(90deg,#7CB93B,#5da320); }

    /* Tab pills */
    .d-tabs{
      display:flex;gap:4px;
      background:#fff;
      border:1.5px solid #DDE6D8;
      border-radius:14px;
      padding:5px;
      margin-bottom:22px;
      box-shadow:0 2px 8px rgba(0,0,0,.04);
    }
    .d-tab{
      flex:1;text-align:center;
      padding:10px 0;border-radius:10px;
      font-size:13.5px;font-weight:600;
      color:#5B6B60;cursor:pointer;
      transition:all .15s;
    }
    .d-tab.active{
      background:linear-gradient(135deg,#183F30,#22553F);
      color:#fff;
      box-shadow:0 3px 10px rgba(24,63,48,.2);
    }
    .d-tab:not(.active):hover{ background:#EEF2EC;color:#183F30; }

    /* Input / search */
    .d-search{
      width:100%;padding:13px 18px;
      background:#fff;border:1.5px solid #DDE6D8;
      border-radius:12px;font-size:14px;
      font-family:'Inter',sans-serif;
      outline:none;transition:all .2s;
      margin-bottom:16px;
    }
    .d-search:focus{ border-color:#7CB93B;box-shadow:0 0 0 3px rgba(124,185,59,.12); }

    /* Chips filter */
    .d-chips{ display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap; }
    .d-chip{
      padding:7px 16px;border-radius:100px;
      font-size:12.5px;font-weight:600;
      background:#fff;border:1.5px solid #DDE6D8;
      color:#5B6B60;cursor:pointer;transition:all .15s;
    }
    .d-chip:hover{ border-color:#7CB93B;color:#183F30; }
    .d-chip.active{
      background:#183F30;color:#fff;border-color:#183F30;
      box-shadow:0 3px 10px rgba(24,63,48,.2);
    }

    /* Profile card */
    .d-profile-banner{
      background:linear-gradient(120deg,#183F30,#22553F);
      border-radius:16px;
      padding:28px;
      display:flex;
      align-items:center;
      gap:20px;
      margin-bottom:20px;
      color:#fff;
    }
    .d-profile-avatar{
      width:64px;height:64px;border-radius:50%;
      background:rgba(255,255,255,.2);
      display:flex;align-items:center;justify-content:center;
      font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;
      border:3px solid rgba(255,255,255,.3);
      flex-shrink:0;
    }
    .d-profile-name{ font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700; }
    .d-profile-sub{ font-size:12px;opacity:.65;margin-top:4px; }

    /* Scan box desktop */
    .d-scan-center{ max-width:560px;margin:0 auto; }
    .d-scanbox{
      background:linear-gradient(135deg,#183F30,#22553F);
      border-radius:20px;padding:40px 32px;
      text-align:center;color:#fff;
    }
    .d-scan-frame{
      width:180px;height:180px;margin:20px auto;
      border:2.5px solid #7CB93B;border-radius:18px;
      display:flex;align-items:center;justify-content:center;
    }
    .d-scan-frame svg{ width:80px;height:80px;opacity:.85; }

    /* Select dropdown */
    .d-select{
      background:#fff;border:1.5px solid #DDE6D8;
      border-radius:12px;padding:12px 18px;
      font-size:14px;font-family:'Inter',sans-serif;
      width:100%;margin-bottom:20px;outline:none;
    }

    /* Two-column job list */
    @media (min-width:1100px){
      .desktop-job-grid{ display:grid;grid-template-columns:1fr 1fr;gap:12px; }
    }
  }

    /* Greet section */
    .desktop-content .greet{ font-size:14px; color:var(--ink-soft); }
    .desktop-content .greet b{
      font-size:28px; display:block; margin-top:4px;
      font-family:'Space Grotesk',sans-serif;
      color:var(--forest);
    }

    /* Stat cards — colored accent bar on left */
    .desktop-content .stat-grid{
      display:grid; grid-template-columns:repeat(4,1fr);
      gap:18px; margin-top:22px;
    }
    .desktop-content .stat{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:22px 20px 18px;
      position:relative;
      overflow:hidden;
      transition:box-shadow .2s, transform .2s;
      cursor:default;
    }
    .desktop-content .stat::before{
      content:'';
      position:absolute;top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,var(--leaf),var(--forest-2));
    }
    .desktop-content .stat:hover{
      box-shadow:0 8px 24px rgba(24,63,48,.10);
      transform:translateY(-2px);
    }

/* =============== STATE =============== */
let state = {

  selected:null,        // block id
  dashTab:'utama',
  role:0,
  scannedShown:false,
};

function toast(msg){
  // Mobile toast
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
  // Desktop toast
  const dt=document.getElementById('desktop-toast');
  if(dt){ dt.textContent=msg; dt.classList.add('show'); setTimeout(()=>dt.classList.remove('show'),1800); }
}
function fmtRp(n){ return 'Rp ' + n.toLocaleString('id-ID'); }
function findBlock(id){ return BLOCKS.find(b=>b.id===id); }

/* =============== RENDER: NAV =============== */
const NAV_ITEMS=[
  {key:'beranda', label:'Beranda', icon:ICONS.home},
  {key:'pekerjaan', label:'Pekerjaan', icon:ICONS.job},
  {key:'scan', label:'Scan', icon:ICONS.scan},
  {key:'dashboard', label:'Dashboard', icon:ICONS.dash},
  {key:'akun', label:'Akun', icon:ICONS.user},
];
const TAB_TITLES={
  beranda:'Beranda',
  pekerjaan:'Pekerjaan',
  scan:'Scan Barcode',
  dashboard:'Dashboard',
  akun:'Akun',
};
function renderNav(){
  // Mobile bottom nav
  document.getElementById('bottomnav').innerHTML = NAV_ITEMS.map(it=>`
    <div class="navitem ${state.tab===it.key?'active':''}" onclick="goTab('${it.key}')">
      ${it.icon}<span>${it.label}</span>
    </div>`).join('');
  // Desktop sidebar nav
  const sn=document.getElementById('sidebar-nav');
  if(sn){
    sn.innerHTML = NAV_ITEMS.map(it=>`
      <div class="sidebar-item ${state.tab===it.key?'active':''}" onclick="goTab('${it.key}')">
        ${it.icon}<span>${it.label}</span>
      </div>`).join('');
  }
  // Desktop sidebar role & avatar
  const sr=document.getElementById('sidebar-role');
  if(sr) sr.textContent = ROLES[state.role];
  const sa=document.getElementById('sidebar-avatar');
  if(sa) sa.textContent = ROLES[state.role][0];
  // Desktop topbar date
  const dateEl=document.getElementById('topbar-date');
  if(dateEl){
    const now=new Date();
    dateEl.textContent = now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }
  // Desktop topbar title + back button
  const dt=document.getElementById('desktop-topbar');
  if(dt){
    let title = TAB_TITLES[state.tab] || 'HERBI Sense';
    if(state.tab==='pekerjaan'){
      if(state.jobView==='detail'&&state.selected) title='Detail Blok - '+state.selected;
      else if(state.jobView==='scan') title='Scan Barcode';
      else if(state.jobView==='riwayat'&&state.selected) title='Pemakaian Blok '+state.selected;
      else if(state.jobView==='evaluasi') title='Evaluasi Efektivitas';
      else if(state.jobView==='hasil') title='Hasil Evaluasi';
    }
    let backAction=null;
    if(state.tab==='pekerjaan'){
      if(state.jobView==='detail') backAction="backTo('list')";
      else if(state.jobView==='scan') backAction="backTo('detail')";
      else if(state.jobView==='riwayat') backAction="backTo('detail')";
      else if(state.jobView==='evaluasi') backAction="backTo('riwayat')";
      else if(state.jobView==='hasil') backAction="backTo('evaluasi')";
    }
    const now=new Date();
    const dateStr=now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    dt.innerHTML = (backAction?`<div class="deskback" onclick="${backAction}">${ICONS.back}</div>`:'')
      + `<h1 id="desktop-title">${title}</h1>`
      + `<span class="topbar-date">${dateStr}</span>`;
  }
}
function goTab(tab){
  state.tab=tab;
  if(tab==='pekerjaan'){ state.jobView='list'; }
  if(tab==='scan'){ state.scannedShown=false; }
  render();
}

function topbar(title, onBack){
  return `<div class="topbar">
    ${onBack?`<div class="backbtn" onclick="${onBack}">${ICONS.back}</div>`:''}
    <h2>${title}</h2>
  </div>`;
}

function screenBeranda(){
  const belumSelesai = BLOCKS.filter(b=>b.status==='Belum Selesai').length;
  const totalRek = BLOCKS.reduce((s,b)=>s+b.rekomendasi,0);
  const totalAkt = BLOCKS.reduce((s,b)=>s+b.aktual,0);
  const eff = Math.round((totalRek/Math.max(totalAkt,1))*100);
  return `
    <div class="greet">Selamat pagi,<b>${ROLES[state.role]}</b></div>
    <div class="stat-grid">
      <div class="stat"><div class="n">${BLOCKS.length}</div><div class="l">Blok dikerjakan</div></div>
      <div class="stat"><div class="n">${totalRek} L</div><div class="l">Rekomendasi hari ini</div></div>
      <div class="stat"><div class="n">${totalAkt} L</div><div class="l">Pemakaian aktual</div></div>
      <div class="stat"><div class="n">${eff}%</div><div class="l">Efisiensi</div></div>
    </div>
    <div class="section-title">Perlu tindak lanjut</div>
    <div class="card">
      <div class="row"><span class="lbl">Blok belum dikerjakan</span><span class="val">${belumSelesai} blok</span></div>
      <div class="row"><span class="lbl">Blok siap dievaluasi (H+14)</span><span class="val">2 blok</span></div>
    </div>
    <button class="btn" onclick="goTab('pekerjaan')">Mulai Pekerjaan</button>
  `;
}

  return `

/* =============== CRUD FUNCTIONS =============== */
let crudMode = null; // 'add' | 'edit'
let crudId = null;   // id blok yang sedang diedit
let deleteTargetId = null;

function autoCalcRek(){
  const luas = parseFloat(document.getElementById('f-luas').value) || 0;
  const dosis = parseFloat(document.getElementById('f-dosis').value) || 0;
  const rek = document.getElementById('f-rekomendasi');
  if(luas && dosis) rek.value = Math.round(luas * dosis);
  else rek.value = '';
}

function openModal(mode, id=null){
  crudMode = mode;
  crudId = id;
  const overlay = document.getElementById('modal-overlay');
  const title = document.getElementById('modal-title');
  // Reset form
  document.getElementById('f-id').value = '';
  document.getElementById('f-afd').value = 'OF';
  document.getElementById('f-luas').value = '';
  document.getElementById('f-dosis').value = '';
  document.getElementById('f-gulma').value = '';
  document.getElementById('f-kerapatan').value = 'Sedang';
  document.getElementById('f-status').value = 'Belum Selesai';
  document.getElementById('f-herbisida').value = 'Glyphosate 480 SL';
  document.getElementById('f-rekomendasi').value = '';

  if(mode === 'edit' && id){
    const b = findBlock(id);
    if(!b) return;
    title.textContent = 'Edit Blok — ' + b.id;
    document.getElementById('f-id').value = b.id;
    document.getElementById('f-id').disabled = true;
    document.getElementById('f-afd').value = b.afdeling;
    document.getElementById('f-luas').value = b.luas;
    document.getElementById('f-dosis').value = b.dosis;
    document.getElementById('f-gulma').value = b.gulma;
    document.getElementById('f-kerapatan').value = b.kerapatan;
    document.getElementById('f-status').value = b.status;
    document.getElementById('f-herbisida').value = b.herbisida;
    document.getElementById('f-rekomendasi').value = b.rekomendasi;
    document.getElementById('f-rekomendasi').readOnly = false;
  } else {
    title.textContent = 'Tambah Blok Baru';
    document.getElementById('f-id').disabled = false;
    document.getElementById('f-rekomendasi').readOnly = false;
  }
  overlay.classList.add('open');
  setTimeout(()=>{
    const firstInput = document.getElementById(mode==='add'?'f-id':'f-luas');
    if(firstInput) firstInput.focus();
  }, 280);
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  crudMode = null;
  crudId = null;
}

function closeModalOutside(e){
  if(e.target === document.getElementById('modal-overlay')) closeModal();
}

function saveBlock(){
  const id = (document.getElementById('f-id').value || '').trim().toUpperCase();
  const afdeling = document.getElementById('f-afd').value;
  const luas = parseFloat(document.getElementById('f-luas').value);
  const dosis = parseFloat(document.getElementById('f-dosis').value);
  const gulma = (document.getElementById('f-gulma').value || '').trim();
  const kerapatan = document.getElementById('f-kerapatan').value;
  const status = document.getElementById('f-status').value;
  const herbisida = document.getElementById('f-herbisida').value;
  const rekomendasi = parseFloat(document.getElementById('f-rekomendasi').value) || Math.round(luas*dosis);

  // Validation
  if(!id){ alert('ID Blok wajib diisi!'); document.getElementById('f-id').focus(); return; }
  if(!luas || luas <= 0){ alert('Luas blok harus lebih dari 0!'); document.getElementById('f-luas').focus(); return; }
  if(!dosis || dosis <= 0){ alert('Dosis harus lebih dari 0!'); document.getElementById('f-dosis').focus(); return; }
  if(!gulma){ alert('Jenis gulma wajib diisi!'); document.getElementById('f-gulma').focus(); return; }

  if(crudMode === 'add'){
    if(BLOCKS.find(b => b.id === id)){
      alert('ID Blok "' + id + '" sudah ada! Gunakan ID lain.');
      document.getElementById('f-id').focus();
      return;
    }
    BLOCKS.push({
      id, afdeling, luas, gulma, kerapatan, herbisida, dosis,
      rekomendasi: rekomendasi || Math.round(luas*dosis),
      status, aktual:0, riwayat:[], evaluasi:null
    });
    closeModal();
    toast('✅ Blok ' + id + ' berhasil ditambahkan!');
    state.tab = 'pekerjaan'; state.jobView = 'list';
  } else if(crudMode === 'edit'){
    const b = findBlock(crudId);
    if(!b) return;
    b.afdeling = afdeling;
    b.luas = luas;
    b.gulma = gulma;
    b.kerapatan = kerapatan;
    b.herbisida = herbisida;
    b.dosis = dosis;
    b.rekomendasi = rekomendasi;
    b.status = status;
    closeModal();
    toast('✏️ Blok ' + crudId + ' berhasil diperbarui!');
    state.selected = crudId;
    state.jobView = 'detail';
  }
  render();
}

function deleteBlock(id){
  deleteTargetId = id;
  const b = findBlock(id);
  document.getElementById('confirm-sub').textContent =
    `Blok ${id} (${b ? b.gulma : ''}) akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.`;
  document.getElementById('confirm-overlay').classList.add('open');
}

function closeConfirm(){
  document.getElementById('confirm-overlay').classList.remove('open');
  deleteTargetId = null;
}

function execDelete(){
  if(!deleteTargetId) return;
  const idx = BLOCKS.findIndex(b => b.id === deleteTargetId);
  const id = deleteTargetId;
  if(idx !== -1) BLOCKS.splice(idx, 1);
  closeConfirm();
  toast('🗑️ Blok ' + id + ' dihapus.');
  state.jobView = 'list';
  state.selected = null;
  render();
}

/* =============== MAIN RENDER =============== */
const IS_DESKTOP = () => window.innerWidth > 680;

function getDesktopHTML(){
  if(state.tab==='beranda') return dScreenBeranda();
  if(state.tab==='pekerjaan'){
    if(state.jobView==='list') return dScreenPekerjaanList();
    if(state.jobView==='detail') return dScreenDetail();
    if(state.jobView==='scan') return dScreenScan();
    if(state.jobView==='riwayat') return dScreenRiwayat();
    if(state.jobView==='evaluasi') return screenEvaluasi();
    if(state.jobView==='hasil') return screenHasil();
  }
  if(state.tab==='scan') return dScreenScan();
  if(state.tab==='dashboard') return dScreenDashboard();
  if(state.tab==='akun') return dScreenAkun();
  return '';
}

function getMobileHTML(){
  if(state.tab==='beranda') return screenBeranda();
  if(state.tab==='pekerjaan'){
    if(state.jobView==='list') return screenPekerjaanList();
    if(state.jobView==='detail') return screenDetail();
    if(state.jobView==='scan') return screenScan();
    if(state.jobView==='riwayat') return screenRiwayat();
    if(state.jobView==='evaluasi') return screenEvaluasi();
    if(state.jobView==='hasil') return screenHasil();
  }
  if(state.tab==='scan') return screenScan();
  if(state.tab==='dashboard') return screenDashboard();
  if(state.tab==='akun') return screenAkun();
  return '';
}

function render(){
  renderNav();
  // Mobile
  const c = document.getElementById('content');
  c.innerHTML = getMobileHTML();
  c.scrollTop = 0;
  // Desktop (completely separate layout)
  const dc = document.getElementById('desktop-content');
  if(dc){ dc.innerHTML = getDesktopHTML(); dc.scrollTop = 0; }
}

render();
</script>
</body>
</html>
